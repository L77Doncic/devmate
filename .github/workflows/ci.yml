name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (POSIX e2e)
        if: runner.os != 'Windows'
        run: npm test

      - name: Build
        run: npm run build

      # VT-6：Build 后校验 dist/ui/web 与 src/ui/web 的资产集一致（清单 + 字节；
      # 源为基准、dist 为镜像）——dist 泄漏 src / stale dist 服役 → 本步退红。
      - name: Verify dist sync
        run: node scripts/check-dist-sync.mjs

      - name: Tests skipped on Windows (documented)
        if: runner.os == 'Windows'
        run: |
          echo "Full vitest suite runs on POSIX (see README: 平台说明)."
          echo "Windows gate = lint + typecheck + build (cross-platform packaging sanity)."
          exit 0
